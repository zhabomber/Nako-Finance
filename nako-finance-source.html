<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAKO Finance</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--card:#fff;--tx:#3b2a1e;--mut:#8a7565;--ln:#f6e4cb;--g:#2e9e4f;--gl:#e2f6e5;--r:#f0506e;--rl:#ffe6ea;--b:#0fa3a3;--bl:#ddf6f4;--s:#8a5cf6;--sl:#efe8ff;--y:#fff0b8;--o:#ef6a50;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1510;--card:#2d2119;--tx:#ffeedd;--mut:#c4a78f;--ln:#46342a;--g:#6fdc8c;--gl:#1d3a26;--r:#ff7f96;--rl:#4a2230;--b:#4fd8d0;--bl:#173e3d;--s:#b99cff;--sl:#33295a;--y:#4a3c14;--o:#ffa45c}}
:root[data-theme="dark"]{--bg:#1f1510;--card:#2d2119;--tx:#ffeedd;--mut:#c4a78f;--ln:#46342a;--g:#6fdc8c;--gl:#1d3a26;--r:#ff7f96;--rl:#4a2230;--b:#4fd8d0;--bl:#173e3d;--s:#b99cff;--sl:#33295a;--y:#4a3c14;--o:#ffa45c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,138,61,.13) 2px,transparent 2.5px) 0 0/26px 26px;color:var(--tx);font:15px/1.5 Nunito,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:600;padding-bottom:92px}
h1,h2,.kpi b,.btn,nav button,.chip b,.hd{font-family:"Baloo 2",Nunito,"Trebuchet MS",system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#f6a65e,#ef6a50 58%,#e5546b);color:#fff;border-radius:0 0 36px 36px;padding:22px 0 54px;margin-bottom:-34px}
.hero .w{position:relative;z-index:1}
.hero h1{margin:6px 0 12px;font-size:32px;line-height:1.1;font-weight:800;display:flex;align-items:center;gap:10px;text-shadow:0 3px 0 rgba(150,50,0,.25)}
.logo{width:50px;height:50px;flex:none;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(150,50,0,.25))}
.deco i{position:absolute;font-style:normal;font-size:34px;opacity:.35;animation:float 4s ease-in-out infinite}
.deco i:nth-child(1){right:6%;top:14%}.deco i:nth-child(2){right:22%;top:58%;animation-delay:-1.5s;font-size:26px}.deco i:nth-child(3){right:38%;top:10%;animation-delay:-2.5s;font-size:22px}
.fam{display:flex;gap:6px;flex-wrap:wrap}
.fam span{background:rgba(255,255,255,.25);padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:inherit}
input[type=date],input[type=number],input[type=text],select{background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:10px 14px;width:100%;transition:.2s}
input:focus{outline:0;border-color:var(--o);box-shadow:0 0 0 4px rgba(255,122,47,.2)}
.hero input[type=date]{width:auto;color:var(--tx);border:0;font-weight:700}
.seg{display:inline-flex;background:rgba(255,255,255,.25);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:#fff;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;transition:.25s}
.seg button:hover{transform:translateY(-1px)}
.seg button.on{background:#fff;color:var(--o);box-shadow:0 3px 0 rgba(150,50,0,.2)}
.sub{font-size:12px;margin-top:9px;font-weight:700;opacity:.95}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}
@media(max-width:760px){.k4,.k3{grid-template-columns:1fr 1fr}.k2{grid-template-columns:1fr}}
@media(max-width:420px){.k3{grid-template-columns:1fr}.hero h1{font-size:26px}}
.card{background:var(--card);border:2px solid var(--ln);border-radius:26px;padding:17px;box-shadow:0 6px 0 var(--ln),0 14px 26px rgba(120,70,20,.08);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.kpi{position:relative;overflow:hidden}
.kpi small{color:var(--mut);font-weight:800;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.kpi .ic{position:absolute;right:10px;top:8px;font-size:30px;animation:wob 3s ease-in-out infinite}
.g{color:var(--g)}.r{color:var(--r)}.bl{color:var(--b)}.s{color:var(--s)}
h2{font-size:20px;margin:26px 4px 10px;font-weight:800}
.ch{display:flex;gap:3px;align-items:flex-end;height:150px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bs{display:flex;align-items:flex-end;gap:1px;flex:1;width:100%;justify-content:center}
.bs i{flex:1;max-width:16px;border-radius:8px 8px 3px 3px;min-height:3px;transform-origin:bottom}
.col span{font-size:10px;color:var(--mut);margin-top:3px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.pr{display:flex;align-items:center;gap:10px;margin:10px 0}
.pr .n{width:155px;font-size:14px}.pr .v{width:100px;text-align:right;font-size:13px;color:var(--mut)}
.pr .bar{flex:1;height:12px;background:var(--ln);border-radius:12px;overflow:hidden}.pr .bar i{display:block;height:100%;border-radius:12px;transform-origin:left}
@media(max-width:520px){.pr{flex-wrap:wrap}.pr .n{width:60%}.pr .v{width:35%}.pr .bar{flex:0 0 100%}}
.who{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:20px;display:grid;place-items:center;font-size:28px;animation:wob 3.5s ease-in-out infinite}
.mini{display:flex;gap:12px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.mini b{color:var(--tx)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);text-align:right;padding:8px 6px;border-bottom:2px solid var(--ln)}th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
tr.hl td{background:var(--y)}tr.hl td:first-child{border-radius:12px 0 0 12px}tr.tt td{font-weight:800;border-top:2px solid var(--ln)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.chip{border:2px solid var(--ln);background:var(--card);border-radius:20px;padding:10px 6px;text-align:center;cursor:pointer;font-size:12px;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.chip:hover{transform:translateY(-3px) scale(1.04)}
.chip div{font-size:24px}.chip.on{border-color:var(--o);background:var(--y);transform:scale(1.05);box-shadow:0 4px 0 var(--o)}
.btn{background:linear-gradient(135deg,#f6a65e,#ef6a50);color:#fff;border:0;border-radius:20px;padding:13px;width:100%;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #c9503a;transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9503a}
.btn2{background:var(--y);color:var(--o);border:2px solid var(--o);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:800;transition:.2s}.btn2:hover{transform:scale(1.06)}
.lbl{font-size:13px;color:var(--mut);margin:14px 0 6px;display:block;font-weight:800}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
.tx .e{font-size:24px;width:42px;height:42px;border-radius:16px;display:grid;place-items:center}
.tx .m{flex:1;min-width:0}.tx .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:17px;transition:.2s}.tx button:hover{transform:rotate(15deg) scale(1.3)}
.empty{background:var(--y);border:2px dashed var(--o);border-radius:22px;padding:14px;margin:48px 0 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:2px solid var(--ln);border-radius:28px;box-shadow:0 6px 0 var(--ln),0 12px 28px rgba(120,70,20,.15);display:flex;justify-content:center;padding:6px 8px;z-index:5;max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:800;cursor:pointer;padding:4px;border-radius:20px;transition:.25s}
nav button div{font-size:23px;transition:.3s cubic-bezier(.3,1.8,.5,1)}nav button.on{color:var(--o);background:var(--y)}nav button.on div{transform:translateY(-3px) scale(1.2)}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px) scale(.8);background:var(--o);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;opacity:0;transition:.35s cubic-bezier(.3,1.8,.5,1);pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.cf{position:fixed;bottom:110px;font-size:24px;pointer-events:none;z-index:20;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-62vh) rotate(420deg);opacity:0}}
@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.94)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
.fx .card,.fx .empty{animation:pop .6s cubic-bezier(.2,1.2,.4,1) both}
.fx .grid>:nth-child(2){animation-delay:.08s}.fx .grid>:nth-child(3){animation-delay:.16s}.fx .grid>:nth-child(4){animation-delay:.24s}
.fx .bs i{animation:grow .8s cubic-bezier(.2,1.2,.4,1) .3s both}.fx .pr .bar i{animation:growx .9s cubic-bezier(.2,1.1,.4,1) .3s both}
.pw{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pie{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 5px 0 var(--ln)}
.pie div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center;font-size:11px;padding:4px}
.pie small{color:var(--mut)}.pie b{font-size:12px}
.pl{flex:1;min-width:150px;font-size:13px}.pl div{display:flex;align-items:center;gap:6px;margin:4px 0}.pl i{width:11px;height:11px;border-radius:50%;flex:none}.pl b{margin-left:auto}
@keyframes spin{from{transform:rotate(-120deg) scale(.3);opacity:0}}
.fx .pie{animation:spin .9s cubic-bezier(.2,1,.3,1) both}
.kid{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}.kid:last-child{border:0}
.bd{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;display:inline-block;margin-top:3px}.bd.ok{background:var(--gl);color:var(--g)}.bd.no{background:var(--y);color:var(--o)}
.md{position:fixed;inset:0;background:rgba(40,20,5,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.mc{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:pop .35s cubic-bezier(.2,1.2,.4,1) both}
.lgw{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f6a65e,#ef6a50 58%,#e5546b)}
.lgc{max-width:380px;width:100%;text-align:center;animation:pop .6s cubic-bezier(.2,1.2,.4,1) both}.lgc .logo{width:84px;height:84px}.lgc h1{margin:6px 0;font-size:26px}.lgc input{text-align:center}
.lm{color:var(--r);font-size:13px;min-height:20px;margin-top:6px}
nav button:nth-child(4){flex:0 0 66px;height:66px;margin-top:-28px;border-radius:50%;background:linear-gradient(135deg,#f6a65e,#ef6a50);color:#fff;box-shadow:0 5px 0 #c9503a}nav button:nth-child(4).on{background:linear-gradient(135deg,#f6a65e,#ef6a50);color:#fff}
[data-theme="dark"] .hero,[data-theme="dark"] .lgw{background:linear-gradient(135deg,#2d2352,#4a2f7a 55%,#7a3a78)}
[data-theme="dark"] body{background-color:var(--bg)}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}.lgc.shake{animation:shake .35s}
nav button{font-size:10px;padding:4px 0}nav button div{font-size:20px}nav{max-width:560px}
.gr{font:800 24px "Baloo 2",Nunito,sans-serif;margin-bottom:8px;text-shadow:0 3px 0 rgba(150,50,0,.25);animation:pop .7s cubic-bezier(.2,1.2,.4,1) both}
.tg{font:800 16px "Baloo 2",Nunito,sans-serif;margin:-4px 0 10px;opacity:.96}
.hero h1 img.logo{filter:drop-shadow(0 4px 0 rgba(120,40,20,.3))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const CATS=[["Gaji bulanan","in","💼"],["Pemasukan lain","in","🎁"],["Zakat","zk","🕌"],["Tabungan Kouhei","sv","👦"],["Tabungan Naurah","sv","👧"],["Tabungan liburan","sv","🏝️"],["Tabungan pensiun","sv","🏖️"],["Uang jajan","out","🍿"],["Belanja Dapur","out","🛒"],["Susu","out","🍼"],["Sayur dan Makan","out","🥬"],["Parkir","out","🅿️"],["Toll","out","🛣️"],["BBM","out","⛽"],["Listrik","out","💡"],["Keamanan/Kebersihan","out","🧹"],["Sedekah","out","🤲"],["Perawatan mobil","out","🚗"],["Makan di luar","out","🍽️"],["Pengeluaran tak terduga","out","🚨"],["Dana darurat","sv","🛟"],["Investasi emas","sv","🪙"],["Tabungan haji/umrah","sv","🕋"]];
const TY={in:["Pemasukan","g","gl"],out:["Pengeluaran","r","rl"],sv:["Tabungan","bl","bl"],zk:["Zakat","s","sl"]};
const PPL=["Riza","Resti"],MS=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"],DN=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const MF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-");return new Date(+a,+b-1,+c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const wk=s=>add(s,-((parse(s).getDay()+6)%7));
const eom=s=>iso(new Date(+s.slice(0,4),+s.slice(5,7),0));
const rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID"),num=n=>n?Math.round(n).toLocaleString("id-ID"):"-";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=iso(new Date());
const TTL={dash:"Our Family Dashboard",add:"Catat Transaksi",gold:"Savings Goals • Emas",zk:"Zakat",hj:"Savings Goals • Haji / Umrah",rep:"Monthly Money Report"};
const night=()=>{const h=new Date().getHours();return h>=17||h<6};
const applyTheme=()=>document.documentElement.setAttribute("data-theme",night()?"dark":"light");applyTheme();
const okTx=t=>t&&t.id&&/^\d{4}-\d\d-\d\d$/.test(t.d)&&Number.isFinite(t.a)&&CATS[t.c];
let CF=null;
const PEND={};
const S={bad:0,sync:null,hist:"m",tx:[],date:today,who:"Semua",tab:"dash",rep:"h",by:"Riza",cat:8,live:false};
let col=null,fx=true,DB=null,CFG={};
try{S.tx=JSON.parse(localStorage.getItem("kk_tx")||"[]")}catch(e){}
try{CFG=JSON.parse(localStorage.getItem("kk_cfg")||"{}")}catch(e){}
function persist(){if(!col)try{localStorage.setItem("kk_tx",JSON.stringify(S.tx))}catch(e){}}
(async()=>{try{const d=window.claude&&await claude.use("db");if(d){DB=d;col=d.collection("tx");col.onSnapshot(s=>{const all=s.docs.map(x=>x.data());const ok=all.filter(okTx),ids=new Set(ok.map(x=>x.id));S.tx=ok.filter(x=>PEND[x.id]!==null).map(x=>PEND[x.id]||x).concat(Object.keys(PEND).filter(k=>PEND[k]&&!ids.has(k)).map(k=>PEND[k]));S.bad=all.length-ok.length;S.sync=new Date();S.live=true;draw()},()=>{S.live=false;draw()});["zakat","emas","haji"].forEach(k=>d.doc("cfg/"+k).onSnapshot(q=>{CFG[k]=q.exists?q.data():{};draw()},()=>{}))}}catch(e){}autoLogin()})();

const W=()=>S.who==="Semua"?null:S.who;
const sum=(a,b,ty,who,c)=>S.tx.filter(t=>t.d>=a&&t.d<=b&&(ty==null||CATS[t.c][1]===ty)&&(who==null||t.w===who)&&(c==null||t.c===c)).reduce((x,t)=>x+t.a,0);
const T=(a,b,who=W())=>{const i=sum(a,b,"in",who),o=sum(a,b,"out",who),s=sum(a,b,"sv",who);return{i,o,s,l:i-o-s}};
function confetti(){const e=["🧡","⭐","🍊","✨","🌴","🥭"];for(let i=0;i<16;i++){const x=document.createElement("span");x.textContent=e[i%6];x.className="cf";x.style.cssText=`left:${10+Math.random()*80}%;--dx:${(Math.random()-.5)*160}px;animation-delay:${Math.random()*.2}s`;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}}
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};

function fmt(e){const d=e.value.replace(/\D/g,"").replace(/^0+/,"");e.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function addTx(){
  const a=+document.getElementById("fa").value.replace(/\D/g,""),d=document.getElementById("fd").value;
  if(!(a>0)||!d){toast("Isi tanggal dan jumlah dulu");return}
  put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d,w:S.by,c:S.cat,a,n:document.getElementById("fn").value.trim()});
  toast("Tersimpan! Terima kasih 🧡");confetti();S.date=d;draw();
}
function wr(id,obj,back){if(!col){persist();return}
 PEND[id]=obj||null;
 Promise.resolve(obj?col.doc(id).set(obj):col.doc(id).delete()).then(()=>{S.sync=new Date();setTimeout(()=>{delete PEND[id]},4000)}).catch(()=>{delete PEND[id];back();draw();toast("Gagal menyimpan ke data bersama: akun ini perlu akses Contributor")})}
function put(t){S.tx.push(t);wr(t.id,t,()=>{S.tx=S.tx.filter(x=>x.id!==t.id)})}
function ask(msg,fn){CF=fn;const m=document.createElement("div");m.id="cf";m.className="md";m.style.zIndex=40;m.style.alignItems="center";m.innerHTML=`<div class="mc" style="border-radius:28px;max-width:360px;text-align:center"><b class="hd" style="font-size:19px">${msg}</b><div class="grid k2" style="margin-top:16px"><button class="btn2" onclick="document.getElementById('cf').remove()">Batal</button><button class="btn" style="font-size:15px" onclick="document.getElementById('cf').remove();CF()">Ya, hapus</button></div></div>`;document.body.appendChild(m)}
function del(id){ask("Hapus transaksi ini?",()=>{const mm=document.getElementById("md");if(mm)mm.remove();const old=S.tx.find(t=>t.id===id),i=S.tx.indexOf(old);if(!old)return;S.tx=S.tx.filter(t=>t.id!==id);wr(id,null,()=>S.tx.splice(i,0,old));draw();toast("Transaksi dihapus ✓")})}
function demo(){

function bars(items,cols){const mx=Math.max(1,...items.flatMap(x=>x.v));
  return `<div class="ch">`+items.map(x=>`<div class="col" title="${esc(x.t)}"><div class="bs">${x.v.map((v,i)=>`<i style="height:${v/mx*100}%;background:${cols[i]}"></i>`).join("")}</div><span>${x.l}</span></div>`).join("")+`</div>`}
function tbl(rows){let t=[0,0,0];
  return `<div class="sc"><table><tr><th></th><th>Masuk</th><th>Keluar</th><th>Tabungan</th><th>Sisa</th></tr>`+rows.map(r=>{t[0]+=r[1];t[1]+=r[2];t[2]+=r[3];return `<tr class="${r[4]?"hl":""}"><td>${r[0]}</td><td class="g">${num(r[1])}</td><td class="r">${num(r[2])}</td><td class="bl">${num(r[3])}</td><td style="color:${r[1]-r[2]-r[3]<0?"var(--r)":"inherit"}">${num(r[1]-r[2]-r[3])}</td></tr>`}).join("")+`<tr class="tt"><td>Total</td><td class="g">${num(t[0])}</td><td class="r">${num(t[1])}</td><td class="bl">${num(t[2])}</td><td>${num(t[0]-t[1]-t[2])}</td></tr></table></div>`}

function dash(f,e,M){
  const D=T(S.date,S.date),Wk=T(wk(S.date),add(wk(S.date),6)),y=S.date.slice(0,4);
  const pc=v=>M.i?Math.round(v/M.i*100)+"% dari pemasukan":"";
  const kp=(l,v,c,ic,s)=>`<div class="card kpi" style="cursor:pointer" onclick="det('${c}')"><span class="ic">${ic}</span><small>${l}</small><b class="${c}">${rp(v)}</b><em>${s}</em></div>`;
  const per=(l,x,hl)=>`<div class="card"><small style="color:var(--mut);font-weight:600">${l}</small><div class="mini" style="margin-top:8px"><span>Masuk <b class="g">${num(x.i)}</b></span><span>Keluar <b class="r">${num(x.o)}</b></span><span>Tabung <b class="bl">${num(x.s)}</b></span></div><b style="font-size:16px;display:block;margin-top:6px">Sisa ${rp(x.l)}</b></div>`;
  let days=[];for(let d=f;d<=e;d=add(d,1)){const x=T(d,d);days.push({l:+d.slice(8),t:+d.slice(8)+" "+MF[+f.slice(5,7)-1]+": "+rp(x.o),v:[x.o]})}
  let mon=[];for(let i=1;i<=12;i++){const a=y+"-"+pad(i)+"-01",x=T(a,eom(a));mon.push({l:MS[i-1],t:MS[i-1]+" masuk "+rp(x.i)+", keluar "+rp(x.o)+", tabung "+rp(x.s),v:[x.i,x.o,x.s]})}
  const gaji=sum(f,e,null,W(),0),zk=gaji*.025,zp=sum(f,e,null,W(),2);
  const cs=CATS.map((c,i)=>({c,i,v:sum(f,e,null,W(),i)})).filter(x=>(x.c[1]==="out"||x.c[1]==="sv")&&x.v>0).sort((a,b)=>b.v-a.v),cm=cs[0]?cs[0].v:1;
  const col={out:"var(--r)",sv:"var(--b)"};
  const po=cs.filter(x=>x.c[1]==="out"),pt=po.reduce((a,x)=>a+x.v,0),PC=["#ff7a2f","#f0506e","#0fa3a3","#8a5cf6","#ffc107","#2e9e4f","#3b82f6","#ec4899","#84cc16","#14b8a6","#f97316","#a16207"];
  let ac=0;const pg=po.map((x,i)=>{const a=ac/pt*100;ac+=x.v;return PC[i%12]+" "+a+"% "+(ac/pt*100)+"%"}).join(",");
  const pie=pt?`<div class="pie" style="background:conic-gradient(${pg})"><div><small>Total keluar</small><b>${rp(pt)}</b></div></div><div class="pl">${po.map((x,i)=>`<div><i style="background:${PC[i%12]}"></i>${x.c[2]} ${x.c[0]}<b>${Math.round(x.v/pt*100)}%</b></div>`).join("")}</div>`:`<p style="color:var(--mut)">Belum ada pengeluaran bulan ini.</p>`;
  const kid=(n,i,em)=>{const all=S.tx.filter(t=>t.c===i).sort((a,b)=>b.d.localeCompare(a.d)),tot=all.reduce((a,t)=>a+t.a,0),bm=sum(f,e,"sv",null,i),l=all[0];return `<div class="kid"><div class="av" style="background:var(--${i===3?"bl":"sl"})">${em}</div><div style="flex:1;min-width:0"><b class="hd" style="font-size:17px">${n}</b><br><small style="color:var(--mut)">${l?"Setoran terakhir "+(+l.d.slice(8))+" "+MS[+l.d.slice(5,7)-1]+" "+l.d.slice(0,4):"Belum ada setoran"} • ${all.length}x setor</small><br><span class="bd ${bm>0?"ok":"no"}">${bm>0?"✅ Sudah setor bulan ini":"⏳ Belum setor bulan ini"}</span></div><div style="text-align:right"><small style="color:var(--mut)">Saldo tabungan</small><br><b class="hd bl" style="font-size:18px">${rp(tot)}</b><br><small style="color:var(--mut)">bulan ini ${num(bm)}</small></div></div>`};
  const sp=[17,18,19].map(i=>{const v=sum(f,e,null,W(),i);return `<div class="pr"><span class="n">${CATS[i][2]} ${CATS[i][0]}</span><span class="bar"><i style="width:${M.o?v/M.o*100:0}%;background:var(--r)"></i></span><span class="v">${num(v)}</span></div>`}).join("");
  const pp=PPL.map((n,i)=>{const x=T(f,e,n);return `<div class="card"><div class="who"><div class="av" style="background:var(--${i?"sl":"bl"})">${i?"👩":"👨"}</div><div><b style="font-size:16px">${n}</b><br><small style="color:var(--mut)">${i?"Istri":"Suami"} • bulan ini</small></div></div><div class="mini"><span>Masuk <b class="g">${num(x.i)}</b></span><span>Keluar <b class="r">${num(x.o)}</b></span><span>Tabung <b class="bl">${num(x.s)}</b></span></div></div>`}).join("");
  return `<div class="grid k4">${kp("Pemasukan",M.i,"g","💰","Bulan "+MF[+f.slice(5,7)-1])}${kp("Pengeluaran",M.o,"r","🛍️",pc(M.o))}${kp("Tabungan",M.s,"bl","🐔",pc(M.s))}${kp("Sisa saldo",M.l,"s","✨","Masuk − keluar − tabungan")}</div>
  ${(()=>{const un=S.tx.filter(t=>!PPL.includes(t.w)).length,hh=S.sync?S.sync.toTimeString().slice(0,5):"";return `<div class="card" style="margin-top:12px;padding:10px 14px;font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center"><b>${S.bad||un?"⚠️":"✅"} Data tervalidasi</b><span>${S.tx.length} transaksi terbaca</span><span>✨ Small Steps, Brighter Future. • ${S.live?"🟢 tersinkron"+(hh?" "+hh:""):"💾 hanya di perangkat ini"}</span>${S.bad?`<span class="r">${S.bad} baris rusak diabaikan</span>`:""}${un?`<span class="r">${un} transaksi tanpa nama pencatat</span>`:""}<span style="color:var(--mut)">Dashboard, laporan, dan Excel memakai data yang sama</span></div>`})()}
  <h2>Komposisi & Savings Goals</h2><div class="grid k2"><div class="card"><b>🥧 Komposisi pengeluaran</b><div class="pw">${pie}</div></div><div><div class="card"><b>🐔 Savings Goals</b>${kid("Kouhei",3,"👦")}${kid("Naurah",4,"👧")}${kid("Liburan",5,"🏝️")}${kid("Pensiun",6,"🏖️")}${kid("Dana darurat",20,"🛟")}${kid("Haji/Umrah",22,"🕋")}</div><div class="card" style="margin-top:14px"><b>🔎 Pengeluaran khusus bulan ini</b>${sp}</div></div></div>
  <h2>Per anggota</h2><div class="grid k2">${pp}</div>
  <div class="grid k2" style="margin-top:12px"><div class="card"><b>Rincian per kategori</b>${cs.length?cs.map(x=>`<div class="pr"><span class="n">${x.c[2]} ${x.c[0]}</span><span class="bar"><i style="width:${x.v/cm*100}%;background:${col[x.c[1]]}"></i></span><span class="v">${num(x.v)}</span></div>`).join(""):`<p style="color:var(--mut)">Belum ada data bulan ini.</p>`}</div>
  <div class="card"><b>🕌 Zakat penghasilan</b><div class="pr"><span class="n">Gaji bulan ini</span><span class="v" style="flex:1">${rp(gaji)}</span></div><div class="pr"><span class="n">Zakat 2,5%</span><span class="v" style="flex:1">${rp(zk)}</span></div><div class="pr"><span class="n">Sudah dibayar</span><span class="v" style="flex:1">${rp(zp)}</span></div><div class="pr"><b class="n">${zk-zp>0?"Kekurangan":"Status"}</b><b class="v ${zk-zp>0?"r":"g"}" style="flex:1">${zk-zp>0?rp(zk-zp):gaji?"Lunas ✓":"-"}</b></div></div></div>
  <h2>Ringkasan periode</h2><div class="grid k3">${per("Hari ini • "+(+S.date.slice(8))+" "+MS[+S.date.slice(5,7)-1],D)}${per("Minggu ini • "+(+wk(S.date).slice(8))+"–"+(+add(wk(S.date),6).slice(8)),Wk)}${per("Bulan ini • "+MF[+f.slice(5,7)-1],M)}</div>
  <h2>Grafik</h2><div class="grid k2"><div class="card"><b>Pengeluaran harian</b><div class="lg"><span>${MF[+f.slice(5,7)-1]} ${f.slice(0,4)}</span></div>${bars(days,["var(--r)"])}</div><div class="card"><b>Per bulan tahun ${y}</b><div class="lg"><span><b style="background:var(--g)"></b>Masuk</span><span><b style="background:var(--r)"></b>Keluar</span><span><b style="background:var(--b)"></b>Tabungan</span></div>${bars(mon,["var(--g)","var(--r)","var(--b)"])}</div></div>
  `;
}
function catpage(f,e){

}
function rep(f,e){
  let rows=[],y=S.date.slice(0,4);
  if(S.rep==="h")for(let d=f;d<=e;d=add(d,1)){const x=T(d,d);rows.push([+d.slice(8)+" "+DN[parse(d).getDay()],x.i,x.o,x.s,d===S.date])}
  else if(S.rep==="w")for(let s=wk(f);s<=e;s=add(s,7)){const a=s<f?f:s,z=add(s,6)>e?e:add(s,6),x=T(a,z);rows.push([+a.slice(8)+"–"+ +z.slice(8)+" "+MS[+f.slice(5,7)-1],x.i,x.o,x.s,S.date>=s&&S.date<=add(s,6)])}
  else for(let i=1;i<=12;i++){const a=y+"-"+pad(i)+"-01",x=T(a,eom(a));rows.push([MF[i-1],x.i,x.o,x.s,i===+S.date.slice(5,7)])}
  const ti={h:"Harian",w:"Mingguan (Senin–Minggu)",b:"Bulanan"}[S.rep];
  return `<div class="card" style="margin-top:46px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:16px">💰 Monthly Money Report <small style="color:var(--mut)">• ${ti}</small></b><div class="seg" style="background:var(--ln)">${[["h","Harian"],["w","Mingguan"],["b","Bulanan"]].map(a=>`<button style="color:var(--tx)" class="${S.rep===a[0]?"on":""}" onclick="S.rep='${a[0]}';draw()">${a[1]}</button>`).join("")}</div></div><p style="color:var(--mut);margin:6px 0 10px">${S.rep==="b"?"Tahun "+y:MF[+f.slice(5,7)-1]+" "+f.slice(0,4)} • tampilan: ${S.who} • nilai dalam Rupiah • sisa = masuk − keluar − tabungan</p>${tbl(rows)}<div class="grid k2" style="margin-top:14px"><button class="btn2" onclick="exp('x')">⬇️ Unduh Excel</button><button class="btn2" onclick="exp('p')">⬇️ Unduh PDF</button></div></div>`;
}

function doLogin(){const u=document.getElementById("lu").value.trim().toLowerCase(),p=document.getElementById("lp").value;
 if(u==="pepaya"&&p==="NakoPepaya"){try{localStorage.setItem("kk_me","Pepaya")}catch(e){}S.me="Pepaya";fx=true;draw()}
 else{document.getElementById("lm").textContent="User atau password salah";const c=document.querySelector(".lgc");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}}
function autoLogin(){try{if(localStorage.getItem("kk_me")==="Pepaya"){S.me="Pepaya";fx=true;draw()}}catch(e){}}

/* rincian klik */
function det(k){const f=S.date.slice(0,7)+"-01",e=eom(f),M=T(f,e),ty={g:"in",r:"out",bl:"sv"}[k],ti={g:"Pemasukan",r:"Pengeluaran",bl:"Tabungan",s:"Sisa saldo"}[k];let h;
 if(k==="s")h=[["Pemasukan","+",M.i,"g"],["Pengeluaran","−",M.o,"r"],["Tabungan","−",M.s,"bl"]].map(a=>`<div class="pr"><span class="n" style="flex:1">${a[0]}</span><b class="${a[3]}">${a[1]} ${rp(a[2])}</b></div>`).join("")+`<div class="pr" style="border-top:2px solid var(--ln);padding-top:8px"><b class="n" style="flex:1">Sisa saldo</b><b class="s">${rp(M.l)}</b></div><p style="color:var(--mut)">Sisa = pemasukan − pengeluaran − tabungan. Tutup lalu ketuk kartu lain untuk rinciannya.</p>`;
 else{const L=srt(S.tx.filter(t=>t.d>=f&&t.d<=e&&CATS[t.c][1]===ty&&(!W()||t.w===W()))),by={};L.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
  h=(L.length?Object.keys(by).sort((a,b)=>by[b]-by[a]).map(i=>`<div class="pr"><span class="n" style="flex:1">${CATS[i][2]} ${CATS[i][0]}</span><b>${rp(by[i])}</b></div>`).join("")+`<h2 style="font-size:16px">Semua transaksi</h2>`+L.map(t=>txr(t,true)).join(""):`<p style="color:var(--mut)">Belum ada data bulan ini.</p>`)}
 const m=document.createElement("div");m.id="md";m.className="md";m.onclick=ev=>{if(ev.target===m)m.remove()};
 m.innerHTML=`<div class="mc"><div style="display:flex;justify-content:space-between;align-items:center"><b class="hd" style="font-size:20px">${ti} • ${MF[+f.slice(5,7)-1]}</b><button class="btn2" onclick="document.getElementById('md').remove()">Tutup ✕</button></div>${h}</div>`;document.body.appendChild(m)}
/* scan struk */
async function shrink(f){const b=await createImageBitmap(f),r=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*r;c.height=b.height*r;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.82))}
async function scan(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;toast("⏳ Membaca struk…");
 try{const sm=await claude.use("sample");if(!sm||!(await sm.limits()).images){toast("Scan belum tersedia di akun ini");return}
  const names=CATS.filter(c=>c[1]==="out").map(c=>c[0]),b=await shrink(f);
  const r=await sm.json('Ini foto struk belanja. Balas HANYA JSON: {"toko":string,"tanggal":"YYYY-MM-DD" atau null,"total":angka rupiah utuh tanpa titik,"kategori":salah satu dari '+JSON.stringify(names)+'}. total = jumlah akhir yang dibayar.',{images:[b],modelTier:"quick"});
  const tot=num0(r.total),dd=/^\d{4}-\d\d-\d\d$/.test(r.tanggal||"")?r.tanggal:today;let ci=CATS.findIndex(c=>c[0]===r.kategori);if(ci<0||CATS[ci][1]!=="out")ci=8;
  if(!(tot>0)){toast("Total struk tidak terbaca, isi manual");return}
  put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:dd,w:S.by,c:ci,a:tot,n:(r.toko||"Struk")+" (scan)"});S.date=dd;draw();toast("✅ "+rp(tot)+" masuk ke "+CATS[ci][0])
 }catch(e){toast(e&&e.code==="not_granted"?"Izin AI ditolak":"Struk gagal dibaca, coba foto lebih jelas")}}
/* export */
function RR(k){const f=S.date.slice(0,7)+"-01",e=eom(f),y=S.date.slice(0,4),R=[];
 if(k==="h")for(let d=f;d<=e;d=add(d,1)){const x=T(d,d);R.push([d,x.i,x.o,x.s])}
 else if(k==="w")for(let s=wk(f);s<=e;s=add(s,7)){const a=s<f?f:s,z=add(s,6)>e?e:add(s,6),x=T(a,z);R.push([a+" s/d "+z,x.i,x.o,x.s])}
 else for(let i=1;i<=12;i++){const a=y+"-"+pad(i)+"-01",x=T(a,eom(a));R.push([MF[i-1]+" "+y,x.i,x.o,x.s])}
 return R.map(r=>[...r,r[1]-r[2]-r[3]])}
async function exp(t){try{const dl=await claude.use("downloads");if(!dl){toast("Unduhan belum tersedia");return}
 const H=["Periode","Pemasukan","Pengeluaran","Tabungan","Sisa"],NM={h:"Harian",w:"Mingguan",b:"Bulanan"},m=S.date.slice(0,7);
 if(t==="x"){if(!window.XLSX){toast("Library Excel belum termuat, coba lagi");return}
  const wb=XLSX.utils.book_new();["h","w","b"].forEach(k=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([H,...RR(k)]),NM[k]));
  const L=S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.w,CATS[x.c][0],CATS[x.c][1],x.n||"",x.a]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Tanggal","Oleh","Kategori","Tipe","Keterangan","Jumlah"],...L]),"Transaksi");
  await dl.save({filename:"NAKO-Laporan-"+m+".xlsx",data:XLSX.write(wb,{type:"array",bookType:"xlsx"})})}
 else{if(!window.jspdf){toast("Library PDF belum termuat, coba lagi");return}
  const doc=new window.jspdf.jsPDF(),R=RR(S.rep),X=[0,100,135,170,200];let y=22;
  doc.setFontSize(15);doc.text("NAKO Finance - Monthly Money Report ("+NM[S.rep]+")",14,13);doc.setFontSize(9);doc.text("Periode: "+MF[+m.slice(5)-1]+" "+m.slice(0,4)+"  |  Tampilan: "+S.who+"  |  Rupiah",14,18);
  const hd=()=>{doc.setFont(undefined,"bold");doc.text(H[0],14,y);[1,2,3,4].forEach(i=>doc.text(H[i],X[i],y,{align:"right"}));doc.setFont(undefined,"normal");y+=6};hd();
  R.forEach(r=>{if(y>284){doc.addPage();y=14;hd()}doc.text(String(r[0]),14,y);[1,2,3,4].forEach(i=>doc.text(num(r[i]),X[i],y,{align:"right"}));y+=5.5});
  const tt=[0,1,2,3,4].map(i=>i?R.reduce((a,r)=>a+r[i],0):0);doc.setFont(undefined,"bold");doc.text("Total",14,y+1);[1,2,3,4].forEach(i=>doc.text(num(tt[i]),X[i],y+1,{align:"right"}));
  await dl.save({filename:"NAKO-Laporan-"+NM[S.rep]+"-"+m+".pdf",data:doc.output("arraybuffer")})}
 }catch(e){if(!e||e.code!=="declined")toast("Gagal mengunduh")}}
/* emas */
function savePrice(){const p=num0(document.getElementById("gp").value);if(!p){toast("Isi harga per gram");return}const d=new Date();setCfg("emas",{price:p,upd:d.getDate()+" "+MS[d.getMonth()]+" "+d.getFullYear()+" (input manual)"});toast("Harga Antam diperbarui ✓")}
function addGold(){const g=parseFloat(document.getElementById("fn").value.replace(",",".")),d=document.getElementById("fd").value,P=(CFG.emas&&CFG.emas.price)||2550000,h=num0(document.getElementById("fa").value)||P;
 if(!(g>0)||!d){toast("Isi gram dan tanggal");return}put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d,w:S.by,c:21,a:Math.round(g*h),g,n:g+" gr @ "+dot(h)});toast("Emas tercatat 🪙");draw()}
function gold(){const E=CFG.emas||{},P=E.price||2550000,U=E.upd||"27 Okt 2026, harga Logam Mulia 1 gram",L=srt(S.tx.filter(t=>t.c===21)),g=L.reduce((a,t)=>a+(t.g||0),0),cost=L.reduce((a,t)=>a+t.a,0),val=g*P,gl=val-cost,oth=S.tx.filter(t=>CATS[t.c][1]==="sv"&&t.c!==21).reduce((a,t)=>a+t.a,0),tot=val+oth,nis=85*P,ok=tot>=nis;
 const row=(a,b,c)=>`<div class="pr"><span class="n" style="flex:1">${a}</span><b class="${c||""}">${b}</b></div>`;
 return `<div class="card" style="margin-top:46px"><b class="hd" style="font-size:18px">🪙 Investasi emas</b><div class="grid k2" style="margin-top:10px"><div class="card kpi"><small>Total emas</small><b>${+g.toFixed(3)} gram</b></div><div class="card kpi"><small>Nilai sekarang (Antam)</small><b class="g">${rp(val)}</b><em>${g?(gl>=0?"▲ ":"▼ ")+rp(Math.abs(gl))+" dari modal "+rp(cost):"Belum ada emas"}</em></div></div>
 <span class="lbl">Harga Antam per gram (Rp) — ubah untuk memperbarui nilai</span><div style="display:flex;gap:8px"><input id="gp" type="text" inputmode="numeric" value="${dot(P)}" oninput="fmt(this)"><button class="btn2" onclick="savePrice()">Simpan</button></div><small style="color:var(--mut)">Terakhir: ${U}. Cek harga terbaru di <a href="https://www.logammulia.com/id/harga-emas-hari-ini" target="_blank" rel="noopener">logammulia.com</a>.</small></div>
 <div class="card" style="margin-top:14px"><b style="font-size:16px">Tambah pembelian emas</b><div class="grid k2"><div><span class="lbl">Berat (gram)</span><input id="fn" type="text" inputmode="decimal" placeholder="contoh: 2,5"></div><div><span class="lbl">Harga beli per gram (opsional)</span><input id="fa" type="text" inputmode="numeric" placeholder="${dot(P)}" oninput="fmt(this)"></div></div><span class="lbl">Tanggal</span><input id="fd" type="date" value="${today}"><br><br><button class="btn" onclick="addGold()">Simpan pembelian</button></div>
 <div class="card" style="margin-top:14px"><b style="font-size:16px">🕌 Estimasi zakat mal 2,5%</b>${row("Nilai emas",rp(val))}${row("Tabungan lain (total saldo)",rp(oth))}${row("Total harta",rp(tot),"hd")}${row("Nisab (85 gram emas)",rp(nis))}${row("Status",ok?"Sudah mencapai nisab":"Belum mencapai nisab",ok?"g":"r")}${row("Estimasi zakat mal 2,5%",rp(ok?tot*.025:0),"s hd")}<small style="color:var(--mut)">Perkiraan kasar: syarat haul (dimiliki 1 tahun) tidak dilacak. Konsultasikan dengan lembaga zakat.</small></div>
 <h2>Riwayat pembelian emas</h2><div class="card">${L.length?L.map(t=>txr(t,true)).join(""):`<p style="color:var(--mut)">Belum ada pembelian emas.</p>`}</div>`}
/* zakat */
function saveZs(){setCfg("zakat",{saldo:num0(document.getElementById("zs").value)});toast("Saldo zakat disimpan ✓")}
function addZk(){const a=num0(document.getElementById("fa").value),d=document.getElementById("fd").value;if(!(a>0)||!d){toast("Isi tanggal dan jumlah");return}put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d,w:S.by,c:2,a,n:document.getElementById("fn").value.trim()});toast("Zakat tercatat 🕌");draw()}
function zkv(f,e){const aw=(CFG.zakat&&CFG.zakat.saldo)||0,L=srt(S.tx.filter(t=>t.c===2)),pd=L.reduce((a,t)=>a+t.a,0),kw=sum(f,e,null,null,0)*.025,pm=sum(f,e,null,null,2);
 return `<div class="card" style="margin-top:46px"><b class="hd" style="font-size:18px">🕌 Saldo zakat</b><div class="grid k2" style="margin-top:10px"><div class="card kpi"><small>Saldo tersedia</small><b class="s">${rp(aw-pd)}</b><em>saldo awal − zakat dibayar</em></div><div class="card kpi"><small>Kewajiban bulan ini (2,5% gaji)</small><b>${rp(kw)}</b><em>${pm>=kw&&kw?"✅ sudah dibayar":"dibayar bulan ini "+num(pm)}</em></div></div>
 <span class="lbl">Saldo zakat awal (input manual, Rp)</span><div style="display:flex;gap:8px"><input id="zs" type="text" inputmode="numeric" value="${aw?dot(aw):""}" placeholder="contoh: 5.000.000" oninput="fmt(this)"><button class="btn2" onclick="saveZs()">Simpan</button></div></div>
 <div class="card" style="margin-top:14px"><b style="font-size:16px">Catat pengeluaran zakat</b><div class="grid k2"><div><span class="lbl">Jumlah (Rp)</span><input id="fa" type="text" inputmode="numeric" placeholder="contoh: 462.500" oninput="fmt(this)"></div><div><span class="lbl">Tanggal</span><input id="fd" type="date" value="${today}"></div></div><span class="lbl">Penerima / keterangan</span><input id="fn" type="text" placeholder="contoh: LAZ / panti asuhan"><br><br><button class="btn" onclick="addZk()">Simpan zakat</button></div>
 <h2>Riwayat zakat dibayar</h2><div class="card">${L.length?L.map(t=>txr(t,true)).join(""):`<p style="color:var(--mut)">Belum ada pembayaran zakat.</p>`}</div>`}

function addHj(){const a=num0(document.getElementById("fa").value),d=document.getElementById("fd").value;if(!(a>0)||!d){toast("Isi tanggal dan jumlah");return}put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d,w:S.by,c:22,a,n:document.getElementById("fn").value.trim()});toast("Setoran haji/umrah tersimpan 🕋");draw()}
function saveHt(){setCfg("haji",{target:num0(document.getElementById("ht").value)});toast("Target disimpan ✓")}
function hjv(f,e){const tg=(CFG.haji&&CFG.haji.target)||0,L=srt(S.tx.filter(t=>t.c===22)),tot=L.reduce((a,t)=>a+t.a,0),bm=sum(f,e,null,null,22),pc=tg?Math.round(tot/tg*100):0;
 return `<div class="card" style="margin-top:46px"><b class="hd" style="font-size:18px">🕋 Tabungan Haji / Umrah</b><div class="grid k2" style="margin-top:10px"><div class="card kpi"><small>Saldo tabungan</small><b class="g">${rp(tot)}</b><em>${L.length}x setoran</em></div><div class="card kpi"><small>Setoran bulan ini</small><b class="bl">${rp(bm)}</b><em>${MF[+f.slice(5,7)-1]}</em></div></div>
 <span class="lbl">Target biaya haji/umrah (opsional, Rp)</span><div style="display:flex;gap:8px"><input id="ht" type="text" inputmode="numeric" value="${tg?dot(tg):""}" placeholder="contoh: 35.000.000" oninput="fmt(this)"><button class="btn2" onclick="saveHt()">Simpan</button></div>${tg?`<div class="pr"><span class="bar"><i style="width:${Math.min(100,pc)}%;background:var(--g)"></i></span><span class="v">${pc}%</span></div><small style="color:var(--mut)">Kurang ${rp(Math.max(0,tg-tot))} lagi</small>`:""}</div>
 <div class="card" style="margin-top:14px"><b style="font-size:16px">Tambah setoran tabungan</b><span class="lbl">Siapa yang menyetor</span><div class="seg" style="background:var(--ln)">${PPL.map(p=>`<button style="color:var(--tx)" class="${S.by===p?"on":""}" onclick="S.by='${p}';draw()">${p===PPL[0]?"👨":"👩"} ${p}</button>`).join("")}</div><div class="grid k2"><div><span class="lbl">Jumlah (Rp)</span><input id="fa" type="text" inputmode="numeric" placeholder="contoh: 500.000" oninput="fmt(this)"></div><div><span class="lbl">Tanggal</span><input id="fd" type="date" value="${today}"></div></div><span class="lbl">Keterangan (opsional)</span><input id="fn" type="text" placeholder="contoh: setoran bulanan haji"><br><br><button class="btn" onclick="addHj()">Simpan setoran</button></div>
 <h2>Riwayat setoran</h2><div class="card">${L.length?L.map(t=>txr(t,true)).join(""):`<p style="color:var(--mut)">Belum ada setoran.</p>`}</div>`}
setInterval(()=>{const o=document.documentElement.getAttribute("data-theme");applyTheme();if(o!==document.documentElement.getAttribute("data-theme"))draw()},60000);

function edt(id){const t=S.tx.find(x=>x.id===id);if(!t)return;const o=document.getElementById("md");if(o)o.remove();
 const m=document.createElement("div");m.id="md";m.className="md";m.onclick=ev=>{if(ev.target===m)m.remove()};
 m.innerHTML=`<div class="mc"><div style="display:flex;justify-content:space-between;align-items:center"><b class="hd" style="font-size:20px">✏️ Edit transaksi</b><button class="btn2" onclick="document.getElementById('md').remove()">Tutup ✕</button></div>
 <span class="lbl">Tanggal</span><input id="ed" type="date" value="${t.d}">
 <span class="lbl">Oleh</span><select id="ew">${PPL.map(p=>`<option${t.w===p?" selected":""}>${p}</option>`).join("")}</select>
 <span class="lbl">Kategori</span><select id="ec">${CATS.map((c,i)=>`<option value="${i}"${t.c===i?" selected":""}>${c[2]} ${c[0]}</option>`).join("")}</select>
 <span class="lbl">Jumlah (Rp)</span><input id="ea" type="text" inputmode="numeric" value="${dot(t.a)}" oninput="fmt(this)">
 ${t.c===21?`<span class="lbl">Berat emas (gram)</span><input id="eg" type="text" inputmode="decimal" value="${t.g||""}">`:""}
 <span class="lbl">Keterangan</span><input id="en" type="text" value="${esc(t.n)}"><br><br>
 <div class="grid k2"><button class="btn" onclick="saveEdit('${id}')">Simpan</button><button class="btn2" style="color:var(--r);border-color:var(--r);background:var(--rl)" onclick="del('${id}')">🗑️ Hapus</button></div></div>`;document.body.appendChild(m)}
function saveEdit(id){const t=S.tx.find(x=>x.id===id),a=num0(document.getElementById("ea").value),d=document.getElementById("ed").value;if(!t||!(a>0)||!d){toast("Isi tanggal dan jumlah");return}
 const nt={...t,d,w:document.getElementById("ew").value,c:+document.getElementById("ec").value,a,n:document.getElementById("en").value.trim()},g=document.getElementById("eg");if(g)nt.g=parseFloat(g.value.replace(",","."))||0;
 S.tx=S.tx.map(x=>x.id===id?nt:x);wr(id,nt,()=>{S.tx=S.tx.map(x=>x.id===id?t:x)});const m=document.getElementById("md");if(m)m.remove();S.date=d;draw();toast("Perubahan tersimpan ✓")}

draw();
</script>
</body>
</html>
